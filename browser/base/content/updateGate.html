<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome: resource:; style-src chrome: resource: 'unsafe-inline';"
    />
    <title>Update required</title>
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link
      rel="stylesheet"
      href="chrome://global/skin/design-system/tokens-shared.css"
    />
    <style>
      html {
        color-scheme: light dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--background-color-canvas, Canvas);
        color: var(--text-color, CanvasText);
        font: message-box;
        height: 100%;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }

      .view {
        width: 360px;
        max-width: 100%;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.3em;
        font-weight: 600;
      }

      .description {
        margin: 0 0 20px;
        font-size: 0.9em;
        color: var(--text-color-deemphasized, GrayText);
      }

      .info-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 16px;
        padding: 10px 12px;
        background: var(--background-color-box, Canvas);
        border-radius: var(--border-radius-small, 4px);
        border: 1px solid var(--border-color-card, ButtonBorder);
      }

      .info-label {
        font-size: 0.8em;
        font-weight: 500;
        color: var(--text-color-deemphasized, GrayText);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .primary-btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 10px 16px;
        font: inherit;
        font-size: 1em;
        font-weight: 600;
        background-color: var(--color-accent-primary, Highlight);
        color: var(--color-accent-primary-content, HighlightText);
        border: none;
        border-radius: var(--border-radius-small, 4px);
        cursor: pointer;
      }

      .primary-btn:hover {
        background-color: var(--color-accent-primary-hover, SelectedItem);
      }

      .ghost-btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 10px 16px;
        font: inherit;
        font-size: 1em;
        font-weight: 600;
        background-color: transparent;
        color: var(--text-color, CanvasText);
        border: 1px solid var(--border-color-interactive, ButtonBorder);
        border-radius: var(--border-radius-small, 4px);
        cursor: pointer;
      }

      .ghost-btn:hover {
        background-color: var(--button-background-color-hover, ButtonFace);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="view">
        <h1>Update required</h1>
        <p class="description">
          Your version of Vento is out of date and can no longer be used with
          this server. Download and install the latest version to continue.
        </p>
        <div class="info-block">
          <span class="info-label">Installed version</span>
          <span id="current-version"></span>
        </div>
        <div class="info-block">
          <span class="info-label">Required version</span>
          <span id="required-version"></span>
        </div>
        <button id="download-btn" class="primary-btn">Download update</button>
        <button id="quit-btn" class="ghost-btn">Quit</button>
      </div>
    </div>
    <script src="chrome://browser/content/updateGate.js"></script>
  </body>
</html>
