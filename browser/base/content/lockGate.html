<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome: resource:; style-src chrome: resource: 'unsafe-inline';"
    />
    <title>Locked</title>
    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link
      rel="stylesheet"
      href="chrome://global/skin/design-system/tokens-shared.css"
    />
    <style>
      html {
        color-scheme: light dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--background-color-canvas, Canvas);
        color: var(--text-color, CanvasText);
        font: message-box;
        height: 100%;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }

      .view {
        width: 360px;
        max-width: 100%;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.3em;
        font-weight: 600;
      }

      .description {
        margin: 0 0 20px;
        font-size: 0.9em;
        color: var(--text-color-deemphasized, GrayText);
      }

      .error {
        margin: 10px 0 0;
        padding: 8px 10px;
        font-size: 0.875em;
        color: var(--text-color-error);
        background-color: var(--background-color-critical);
        border-radius: var(--border-radius-small, 4px);
      }

      .primary-btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 10px 16px;
        font: inherit;
        font-size: 1em;
        font-weight: 600;
        background-color: var(--color-accent-primary, Highlight);
        color: var(--color-accent-primary-content, HighlightText);
        border: none;
        border-radius: var(--border-radius-small, 4px);
        cursor: pointer;
      }

      .primary-btn:hover:not(:disabled) {
        background-color: var(--color-accent-primary-hover, SelectedItem);
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .secondary-btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 10px 16px;
        font: inherit;
        font-size: 1em;
        font-weight: 600;
        background-color: transparent;
        color: var(--text-color-error);
        border: 1px solid var(--text-color-error);
        border-radius: var(--border-radius-small, 4px);
        cursor: pointer;
      }

      .secondary-btn:hover {
        background-color: var(--background-color-critical);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="view">
        <h1>Vento is locked</h1>
        <p class="description">
          Authenticate to continue, or sign out to switch accounts.
        </p>
        <p id="lock-error" class="error" hidden></p>
        <button id="unlock-btn" class="primary-btn">Unlock</button>
        <button id="signout-btn" class="secondary-btn">Sign out</button>
      </div>
    </div>
    <script src="chrome://browser/content/lockGate.js"></script>
  </body>
</html>
