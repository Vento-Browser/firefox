name: Build Vento Browser

on:
  push:
    branches: [my_dev]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A full browser build takes 1.5–3 h per platform on GitHub-hosted runners.
jobs:
  build-macos:
    name: macOS (aarch64)
    # macos-26: Firefox requires macOS SDK >= 26.2 (Xcode 26.2+)
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap and build
        run: ./.github/scripts/ci-build.sh
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/.mozbuild

      # Generate + sign the full-update MAR for the auto-updater and print the
      # publish JSON. Skips itself (no-op success) until the signing key secret
      # is configured, so the build workflow keeps passing before then.
      # The secret holds `tar czf - -C <nssdb-parent> nssdb | base64` of the NSS
      # DB that contains the MAR signing private key.
      - name: Generate signed update MAR
        env:
          MAR_SIGNING_NSSDB_B64: ${{ secrets.MAR_SIGNING_NSSDB_B64 }}
        run: |
          if [ -z "${MAR_SIGNING_NSSDB_B64:-}" ]; then
            echo "MAR_SIGNING_NSSDB_B64 secret not set - skipping MAR generation"
            exit 0
          fi
          nssdb="$(mktemp -d)"
          echo "$MAR_SIGNING_NSSDB_B64" | base64 -d | tar -xzf - -C "$nssdb"
          keyfile="$(find "$nssdb" \( -name key4.db -o -name key3.db \) | head -1)"
          dbdir="$([ -n "$keyfile" ] && dirname "$keyfile" || echo "$nssdb")"
          ./.github/scripts/make-update-mar.sh -d "sql:$dbdir"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vento-macos-aarch64
          path: obj-*/dist/*.dmg
          if-no-files-found: error

      - name: Upload update MAR
        uses: actions/upload-artifact@v4
        with:
          name: vento-macos-aarch64-mar
          path: |
            obj-*/dist/update/*.mar
            obj-*/dist/update/*.publish.json
          if-no-files-found: ignore

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MOZILLABUILD: C:\mozilla-build
    steps:
      # Firefox sources must keep LF endings; do this before checkout.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install MozillaBuild
        run: |
          Invoke-WebRequest -Uri https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile "$env:TEMP\MozillaBuildSetup.exe"
          Start-Process -FilePath "$env:TEMP\MozillaBuildSetup.exe" -ArgumentList '/S' -Wait

      - name: Bootstrap and build
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          C:\mozilla-build\msys2\usr\bin\bash.exe -l -c "cd '$ws' && ./.github/scripts/ci-build.sh"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vento-windows-x86_64
          path: |
            obj-*/dist/*.zip
            obj-*/dist/install/sea/*.exe
          if-no-files-found: error
